<!doctype html>

<head>

<title>陳辰瑋｜個人網站</title>
<style>
:root{font-family:system-ui,"Microsoft JhengHei",sans-serif;color:#16352b;background:#f6f5ef;scroll-behavior:smooth}
*{box-sizing:border-box}body{margin:0}a{color:inherit}.wrap{width:min(1100px,calc(100% - 40px));margin:auto}
header,.hero{background:#12271f;color:#f8f9f2}header .wrap{min-height:76px;display:flex;justify-content:space-between;align-items:center;gap:16px}
header a{text-decoration:none}header a:hover{color:#cfe6aa}.brand{font-weight:750;font-size:1.1rem}.nav{font-size:.92rem;color:#d4ded3}
.hero{position:relative;overflow:hidden;padding:clamp(85px,13vw,150px) 0 clamp(100px,14vw,155px)}
.hero:after{content:"";position:absolute;right:-10%;top:-30%;width:min(65vw,650px);aspect-ratio:1;border:1px solid #8ba58255;border-radius:50%;box-shadow:0 0 0 85px #9dbb8910,0 0 0 170px #9dbb890a}
.hero .wrap{position:relative;z-index:1}.eyebrow{color:#cfe8a8;font-size:.82rem;font-weight:700;letter-spacing:.18em;margin:0 0 22px}
h1{font-size:clamp(3.6rem,11vw,7.5rem);line-height:1.1;letter-spacing:-.065em;margin:0}.subtitle{color:#cbd8ca;font-size:clamp(1rem,2.3vw,1.3rem);margin:25px 0 0}
.accent{height:3px;width:64px;background:#cce49a;margin-top:38px}
main{padding:85px 0 110px}h2{font-size:clamp(1.6rem,4vw,2.1rem);letter-spacing:-.04em;margin:0 0 25px}
.info{display:grid;grid-template-columns:repeat(5,1fr);background:#fffefa;border:1px solid #dce1d5;border-radius:18px;overflow:hidden}
.item{padding:30px 18px;border-right:1px solid #e7e9e2}.item:last-child{border-right:0}
.label{display:block;color:#718276;font-size:.83rem;margin-bottom:12px}.value{font-size:clamp(1rem,1.65vw,1.25rem);font-weight:700;white-space:nowrap}
#course{margin-top:92px}.card{display:grid;grid-template-columns:1fr 1fr;min-height:350px;border-radius:20px;overflow:hidden;border:1px solid #d7dfd4;background:#e9eee3}
.copy{padding:clamp(32px,5vw,60px);display:flex;flex-direction:column;justify-content:center}.kicker{font-size:.8rem;letter-spacing:.16em;color:#52735c;font-weight:750;margin:0 0 20px}
h3{font-size:clamp(2rem,4vw,3rem);letter-spacing:-.055em;margin:0 0 16px}.copy p:last-child{color:#53685a;margin:0;font-size:1rem}
.art{background:#285240;display:grid;place-items:center;position:relative;overflow:hidden}.art:before{content:"";position:absolute;width:88%;aspect-ratio:1;border:1px solid #ffffff30;border-radius:50%}
.window{position:relative;width:min(68%,330px);aspect-ratio:1.3;background:#f1f4ec;border-radius:12px;box-shadow:18px 23px 0 #102a2370,0 30px 60px #102a2390;overflow:hidden;transform:rotate(-5deg)}
.bar{height:18%;background:#d8e3d0;display:flex;align-items:center;gap:6px;padding-left:15px}.dot{width:8px;height:8px;border-radius:50%;background:#83a87c}
.screen{padding:12%;display:grid;gap:12px}.line{width:83%;height:11px;background:#b9cfb6;border-radius:6px}.line.short{width:55%}.tiles{display:flex;gap:9px;margin-top:10px}.tiles i{width:42px;height:42px;background:#a7c69e;border-radius:8px}.tiles i:nth-child(2){background:#d0dfa8}.tiles i:nth-child(3){background:#d6e3d1}
footer{border-top:1px solid #dce1d5;padding:26px 0;color:#708274;font-size:.86rem}
@media(max-width:800px){.info{grid-template-columns:repeat(2,1fr)}.item{border-bottom:1px solid #e7e9e2}.item:nth-child(2n){border-right:0}.item:last-child{border-bottom:0}.card{grid-template-columns:1fr}.art{min-height:290px}}
@media(max-width:420px){.item{padding:22px 14px}.value{font-size:.95rem}main{padding-top:65px}#course{margin-top:72px}}
</style>
</head>

</main><footer><div class="wrap">© 陳辰瑋 · 1142949</div></footer>
